[pytest]
# Minimal pytest configuration for the first-slice unit-test harness.
# Discovery is scoped to the `tests/` package; business flows, providers,
# and CLI are intentionally out of scope at this iteration.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Scope markers for future slices. Only `unit` is exercised today.
markers =
    unit: pure unit tests with no external IO (current slice)
    integration: tests requiring external services (out of scope this slice)
